<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: #f3f4f6;
      color: #1f2937;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 360px;
      padding: 2rem;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
    }

    h1 { margin: 0 0 1.5rem; font-size: 1.5rem; }

    .field { margin-bottom: 1rem; }

    label {
      display: block;
      margin-bottom: .3rem;
      font-size: .9rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: .65rem .75rem;
      font: inherit;
      border: 1px solid #d1d5db;
      border-radius: 6px;
    }

    input:focus {
      outline: 2px solid #2563eb;
      outline-offset: 1px;
    }

    input.invalid { border-color: #dc2626; }

    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 4.5rem; }

    .toggle {
      position: absolute;
      right: .4rem;
      top: 50%;
      transform: translateY(-50%);
      width: auto;
      padding: .25rem .5rem;
      font-size: .8rem;
      color: #2563eb;
      background: none;
      border: 0;
      cursor: pointer;
    }

    .error {
      min-height: 1.2em;
      margin: .3rem 0 0;
      font-size: .85rem;
      color: #dc2626;
    }

    .counter {
      margin: .3rem 0 0;
      font-size: .8rem;
      color: #6b7280;
      text-align: right;
    }

    .submit {
      width: 100%;
      padding: .7rem;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: #2563eb;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    .submit:hover { background: #1d4ed8; }
    .submit:disabled { background: #93a8d8; cursor: not-allowed; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Sign in</h1>

    <form id="login-form" method="post" novalidate>
      <input type="hidden" name="csrf-token" value={{csrf_token}}>

      <div class="field">
        <label for="accountId">Employee Id</label>
        <input id="accountId" name="accountId" type="accountId" maxlength="200"
               autocomplete="accountId" autofocus required>
        <p class="counter"><span id="accountId-count">0</span>/200</p>
        <p class="error" id="accountId-error" role="alert"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" maxlength="128"
                 autocomplete="current-password" required>
          <button type="button" class="toggle" id="toggle" aria-pressed="false">Show</button>
        </div>
        <p class="error" id="password-error" role="alert"></p>
      </div>

      <button type="submit" class="submit" id="submit">Sign in</button>
    </form>
  </main>

  <script>
    const form = document.getElementById("login-form");
    const accountId = document.getElementById("accountId");
    const password = document.getElementById("password");
    const accountIdError = document.getElementById("accountId-error");
    const passwordError = document.getElementById("password-error");
    const count = document.getElementById("accountId-count");
    const toggle = document.getElementById("toggle");
    const submit = document.getElementById("submit");

    // Live character counter for the accountId (max 200)
    accountId.addEventListener("input", () => {
      count.textContent = accountId.value.length;
    });

    // Show / hide password
    toggle.addEventListener("click", () => {
      const show = password.type === "password";
      password.type = show ? "text" : "password";
      toggle.textContent = show ? "Hide" : "Show";
      toggle.setAttribute("aria-pressed", String(show));
    });

    function setError(input, el, message) {
      el.textContent = message;
      input.classList.toggle("invalid", Boolean(message));
    }

    // Validate before sending (the server must still validate too)
    form.addEventListener("submit", (e) => {
      const accountIdValue = accountId.value.trim();
      let ok = true;

      if (!accountIdValue) {
        setError(accountId, accountIdError, "Enter your accountId address.");
        ok = false;
      } else if (accountIdValue.length > 200) {
        setError(accountId, accountIdError, "accountId can't be longer than 200 characters.");
        ok = false;
      } else if (!/^H0\d+$/.test(accountIdValue)) {
        setError(accountId, accountIdError, "Enter a valid accountId address.");
        ok = false;
      } else {
        setError(accountId, accountIdError, "");
      }

      if (!password.value) {
        setError(password, passwordError, "Enter your password.");
        ok = false;
      } else {
        setError(password, passwordError, "");
      }

      if (!ok) {
        e.preventDefault();
        return;
      }

      // Prevent double submits
      submit.disabled = true;
      submit.textContent = "Signing in...";
    });
  </script>
</body>
</html>
