<style>
.anim-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 16/10;
  --bg1: #eef0f5;
  --bg2: #dfe3ec;
  --glow: rgba(90,120,220,.18);
  font-family: 'Inter', sans-serif;
  border-radius: 14px;
}
.anim-wrapper * { box-sizing: border-box; }
#wrap { width: 100%; height: 100%; position: relative; }
#frame { position: relative; width: 100%; height: 100%; border-radius: 14px; overflow: hidden; background: #0b0d14; box-shadow: 0 40px 100px -20px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.09), 0 0 90px -25px rgba(37,99,235,.5); }
#cam { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; will-change: transform; backface-visibility: hidden; }
#ifr { position: absolute; inset: 0; width: 1440px; height: 900px; border: 0; background: #fff; pointer-events: none; contain: strict; }
#veil { position: absolute; inset: 0; background: #fff; opacity: 0; transition: opacity .45s ease; pointer-events: none; z-index: 4; }
#hl { position: absolute; left: 0; top: 0; width: 10px; height: 10px; border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .45s ease; z-index: 5; }
#hl.light { background: rgba(37,99,235,.05); box-shadow: 0 0 0 1.5px rgba(59,130,246,.6), 0 0 18px 2px rgba(37,99,235,.28), 0 0 0 4000px rgba(8,10,18,.17), 0 12px 28px rgba(0,0,0,.25); }
#hl.dark { box-shadow: 0 0 0 1px rgba(96,165,250,.6), 0 0 14px 2px rgba(37,99,235,.35), 0 0 0 4000px rgba(8,10,18,.16), 0 10px 24px rgba(0,0,0,.25); }
#rip { position: absolute; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid rgba(59,130,246,.55); background: rgba(59,130,246,.12); opacity: 0; pointer-events: none; z-index: 6; }
#rip.go { animation: rip .75s cubic-bezier(.2,.7,.2,1); }
@keyframes rip { 0% { opacity: .9; transform: translate(-50%,-50%) scale(.3); } 100% { opacity: 0; transform: translate(-50%,-50%) scale(3.2); } }
#cur, #cur2 { position: absolute; left: 0; top: 0; width: 26px; height: 26px; z-index: 9; pointer-events: none; opacity: 0; transform-origin: 3px 2px; will-change: transform; }
#cur { transition: opacity .3s ease; } #cur2 { z-index: 8; }
#cur svg, #cur2 svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); transform-origin: 3px 2px; transition: transform .12s ease; }
#cur.press svg { transform: scale(.9); }
#capBox { position: absolute; bottom: 20px; left: 0; width: 100%; min-height: 54px; display: flex; align-items: center; justify-content: center; z-index: 20; pointer-events: none; }
#cap { display: flex; align-items: center; gap: 14px; padding: 12px 20px 12px 14px; border-radius: 16px; background: rgba(7,8,13,.94); color: #fff; box-shadow: 0 12px 32px rgba(0,0,0,.5), 0 0 0 1px rgba(59,130,246,.5), 0 0 24px -4px rgba(37,99,235,.4); opacity: 0; transform: translateY(8px); transition: opacity .55s ease, transform .75s cubic-bezier(.2,.7,.2,1); font-family: Inter, sans-serif; max-width: 90%; }
#cap.on { opacity: 1; transform: none; }
#cap.out { opacity: 0; transform: translateY(-6px); }
.cdots { display: flex; gap: 5px; } .cdots i { width: 20px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.22); transition: background .4s ease; }
.cdots i.a { background: #3b82f6; box-shadow: 0 0 8px rgba(59,130,246,.7); }
#cap.nodots .cdots { display: none; }
.ctx { display: flex; flex-direction: column; gap: 2px; line-height: 1.2; text-align: left; }
.ctx b { font-weight: 600; font-size: 16px; letter-spacing: -.01em; color: #fff; }
.ctx span { font-size: 12px; color: rgba(255,255,255,.72); }
#cap.big { padding: 14px 22px 14px 16px; } #cap.big .ctx b { font-size: 20px; } #cap.big .ctx span { font-size: 13px; }
.ctx em { font-style: normal; font-weight: 600; font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: #7fb0ff; }
#veil2 { position: absolute; inset: 0; z-index: 12; background: radial-gradient(900px 520px at 50% 42%, rgba(37,99,235,.32), transparent 70%), #07080d; opacity: .94; transition: opacity .9s ease; pointer-events: none; }
#hero { position: absolute; inset: 0; z-index: 13; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px; padding: 4%; pointer-events: none; opacity: 0; transform: translateY(14px) scale(.985); transition: opacity .8s ease, transform 1.1s cubic-bezier(.2,.7,.2,1); font-family: Inter, sans-serif; }
#hero.on { opacity: 1; transform: none; }
#hT { margin: 0; font-weight: 700; font-size: 48px; line-height: 1.04; letter-spacing: -.035em; color: #fff; }
#hT em { font-style: normal; color: #60a5fa; }
#hS { margin: 0; font-weight: 500; font-size: 18px; line-height: 1.35; color: rgba(255,255,255,.72); }
#hSteps, #hChips { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
#hSteps div { display: flex; align-items: center; gap: 10px; background: #0f1118; border: 1px solid rgba(255,255,255,.1); border-radius: 14px; padding: 10px 16px; font-weight: 600; font-size: 14px; color: #fff; box-shadow: 0 10px 28px rgba(0,0,0,.45); opacity: 0; transform: translateY(10px); transition: opacity .6s ease, transform .7s cubic-bezier(.2,.7,.2,1); }
#hSteps i { font-style: normal; width: 24px; height: 24px; border-radius: 50%; background: #2563eb; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; box-shadow: 0 0 14px rgba(37,99,235,.6); }
#hero.on #hSteps div { opacity: 1; transform: none; }
#hSteps div:nth-child(1) { transition-delay: .35s; } #hSteps div:nth-child(2) { transition-delay: .6s; } #hSteps div:nth-child(3) { transition-delay: .85s; }
#hChips span { font-weight: 500; font-size: 12px; padding: 5px 12px; border-radius: 99px; background: rgba(255,255,255,.08); color: #e6e7ee; border: 1px solid rgba(255,255,255,.08); opacity: 0; transition: opacity .6s ease .9s; }
#hero.on #hChips span { opacity: 1; }
#frame { animation: enter 1.2s cubic-bezier(.2,.7,.2,1) both; }
@keyframes enter { from { opacity: 0; transform: translateY(12px) scale(.99); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #frame { animation: none; } }
</style>

<div class="anim-wrapper" id="animWrapper">
  <div id="wrap">
    <div id="frame">
      <div id="cam">
        <iframe id="ifr" title="Hooter dashboard" src="about:blank"></iframe>
        <div id="hl"></div>
        <div id="rip"></div>
        <div id="veil"></div>
        <div id="cur2"><svg viewBox="0 0 24 24"><path d="M3 2l.5 17.5 4.6-4.4 3.3 7.3 3.1-1.4-3.3-7.2 6.4-.2z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
        <div id="cur"><svg viewBox="0 0 24 24"><path d="M3 2l.5 17.5 4.6-4.4 3.3 7.3 3.1-1.4-3.3-7.2 6.4-.2z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
      </div>
      <div id="veil2"></div>
      <div id="hero" class="m-open on">
        <h1 id="hT">One dashboard.<br><em>Every channel.</em></h1>
        <p id="hS">Orders, inventory, shipping &amp; returns — in one engine</p>
        <div id="hSteps"><div><i>1</i>Pick an order</div><div><i>2</i>Validate &amp; pack</div><div><i>3</i>Dispatch</div></div>
        <div id="hChips"><span>Amazon</span><span>Flipkart</span><span>Meesho</span><span>Myntra</span><span>Shopify</span><span>Website</span></div>
      </div>
    </div>
  </div>
  <div id="capBox">
    <div id="cap" class="nodots">
      <div class="cdots"><i></i><i></i><i></i></div>
      <div class="ctx"><em id="capL"></em><b id="capT"></b><span id="capS"></span></div>
    </div>
  </div>
</div>

<script src="/static/js/hero_animation.js" defer></script>
